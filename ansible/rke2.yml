---

- name: Configure enp2s0 (VLAN 99, for macvlan, for Matter) and enp3s0 (bare, for macvlan, for longhorn)
  hosts: k8s_homeserver
  become: true
  become_user: root
  tags:
    - rke2
  tasks:
    # --- enp2s0: unchanged base, VLAN 99 added on top ---
    - name: Ensure vlan package is installed (8021q support for ifupdown)
      ansible.builtin.apt:
        name: vlan
        state: present
        update_cache: true

    - name: Load 8021q kernel module now
      community.general.modprobe:
        name: 8021q
        state: present

    - name: Persist 8021q module load across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/8021q.conf
        content: "8021q\n"
        mode: '0644'

    - name: Add VLAN 99 interface definition on enp2s0
      ansible.builtin.copy:
        dest: /etc/network/interfaces.d/enp2s0.99
        content: |
          auto enp2s0.99
          iface enp2s0.99 inet manual
              vlan-raw-device enp2s0
          # No inet/inet6 address — macvlan children (HA, later OTBR) handle their own
        mode: '0644'
      register: vlan99_file

    - name: Bring up VLAN 99 interface
      ansible.builtin.command: ifup enp2s0.99
      when: vlan99_file.changed
      changed_when: true

    # --- enp3s0: bring up on boot, no address, for the Longhorn macvlan ---
    - name: Add enp3s0 interface definition (no address)
      ansible.builtin.copy:
        dest: /etc/network/interfaces.d/enp3s0
        content: |
          auto enp3s0
          iface enp3s0 inet manual
        mode: '0644'
      register: enp3s0_file

    - name: Bring up enp3s0
      ansible.builtin.command: ifup enp3s0
      when: enp3s0_file.changed
      changed_when: true

    # --- Stop the host's VLAN parent interfaces from accepting RAs ---
    - name: Disable IPv6 RA acceptance on enp2s0.99 (host parent — pods handle their own)
      ansible.posix.sysctl:
        name: "net.ipv6.conf.enp2s0/99.accept_ra"
        value: "0"
        sysctl_file: /etc/sysctl.d/99-macvlan-no-ra.conf
        state: present
        reload: true

    - name: Disable IPv6 RA acceptance on enp3s0 (host parent)
      ansible.posix.sysctl:
        name: "net.ipv6.conf.enp3s0.accept_ra"
        value: "0"
        sysctl_file: /etc/sysctl.d/99-macvlan-no-ra.conf
        state: present
        reload: true

- name: Install rke2 services dependencies
  hosts: k8s_homeserver
  become: true
  become_user: root
  tags:
    - rke2
  roles:
    - {role: longhorn}

# TODO: No idea why I get temporary name resolution failure otherwise
- name: Hardcode rke2 domains in /etc/hosts
  hosts: k8s_homeserver
  become: true
  become_user: root
  tags:
    - rke2
  tasks:
    - lineinfile:
        state: present
        dest: /etc/hosts
        line: "{{ item }}"
      loop:
        - "188.114.96.11 get.rke2.io"
        - "140.82.121.4 github.com"

- name: Obtain rke2_token from Bitwarden, if it's not explicitly provided
  hosts: k8s_homeserver
  tags:
    - always
  gather_facts: false
  pre_tasks:
    - name: Obtain rke2_token from Bitwarden
      # Throttle to one, so the rbw can keep the password in memory
      throttle: 1
      ansible.builtin.command:
        cmd: rbw get homeserver/rke2/token
      check_mode: false
      changed_when: false
      delegate_to: 127.0.0.1
      register: rke2_token_bitwarden
      when: rke2_token | default("") | length < 1

    - name: Set rke2_token from Bitwarden
      when: rke2_token | default("") | length < 1
      ansible.builtin.set_fact:
        rke2_token: "{{ rke2_token_bitwarden.stdout }}"

- name: Set up rke2
  hosts: k8s_homeserver
  tags:
    - rke2
  become: true
  become_user: root
  vars:
    rke2_ha_mode: true
    # TODO: complaining about ipv4_default_address variable, let's try to make it work
    rke2_ha_mode_keepalived: false
    # rke2_version: v1.33.13+rke2r2
    # rke2_version: v1.34.10+rke2r1
    # rke2_version: v1.35.7+rke2r1
    rke2_version: v1.36.3+rke2r1
    rke2_disable:
      - rke2-ingress-nginx
    rke2_ingress_controller: none
    rke2_servers_group_name: k8s_controlplanes
    rke2_agents_group_name: k8s_workers
    rke2_server_options:
      - "embedded-registry: true"
      - "supervisor-metrics: true"
    rke2_custom_registry_mirrors:
      - name: "*"
    rke2_cni:
      - multus
      - canal
    rke2_custom_manifests:
      - rke2_custom_manifests/canal-config.yaml
      - rke2_custom_manifests/multus-config.yaml
    # Copy of the defaults, for the sake of completeness
    rke2_cluster_cidr:
      - 10.42.0.0/16
    rke2_service_cidr:
      - 10.43.0.0/16
  roles:
    - role: lablabs.rke2
